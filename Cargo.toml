[package]
name = "quillwright"
version = "0.4.0"
edition = "2021"
description = "A distraction-free writing environment for novels and long-form fiction, built on plain Markdown and designed to work alongside AI agents"
license = "MIT"
repository = "https://github.com/fabiocmazzo/quillwright"
categories = ["text-editors"]
keywords = ["writing", "fiction", "novel", "markdown", "editor"]
readme = "README.md"
homepage = "https://fabiocmazzo.github.io/quillwright/"
# Only what the build and crates.io need. Packaging, the website, and local notes stay out.
include = [
    "/src/**",
    "/assets/fonts/**",
    "/assets/icon/**",
    "/assets/dictionaries/**",
    "/assets/kinds/**",
    "/build.rs",
    "/docs/config.example.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
spellbook       = "0.4"
# glow (OpenGL) is the renderer Quillwright has always used; eframe's default is wgpu.
eframe          = { version = "0.37", default-features = false, features = [
    "accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts",
    "wayland", "x11",
] }
egui            = "0.37"
# Not used directly: keeps winit's default features, which eframe no longer enables
# without its own defaults (window decorations on GNOME Wayland, loading libwayland
# at runtime so one Linux binary also runs on X11-only systems).
winit           = "0.30"
pulldown-cmark  = { version = "0.10", default-features = false }
rfd             = "0.11"
directories     = "5.0"
serde           = { version = "1.0", features = ["derive"] }
toml            = "0.8"
tempfile        = "3"
fontdb = "0.23"
ab_glyph = "0.2"
notify = "8"
similar = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Export, all pure Rust: typst lays out PDFs, docx-rs writes Word files, and
# EPUB/ODT are zip packages written by hand.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
docx-rs = "0.4.22"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
yaml-rust2 = "0.13"
imagesize = "0.15"
# Decoding research images; the same features typst already enables.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Rendering research PDFs (pure Rust, already used by typst). The default features embed
# the 14 standard PDF fonts and the CJK CMaps, about 600 KB.
hayro = "0.7.1"
# hayro's geometry types (text extraction), and folding accents for search. Both are
# already in the build.
kurbo = "0.13"
unicode-normalization = "0.1"
# Compressing the PDF text cache (pure Rust backend, already in the build).
flate2 = "1"
base64 = "0.22"

[[bin]]
name = "quillwright"
path = "src/main.rs"

# Reading the system's light or dark mode from the desktop portal (src/system_theme.rs).
# Both are already in the dependency tree through eframe's accessibility support.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
futures-lite = { version = "2.6", default-features = false, features = ["std"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
# Smaller downloads: drop debug symbols from release binaries.
strip = true
