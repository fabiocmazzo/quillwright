[package]
name = "quillwright"
version = "0.2.0"
edition = "2021"
description = "A distraction-free writing environment for novels and long-form fiction, built on plain Markdown and designed to work alongside AI agents"
license = "MIT"
repository = "https://github.com/fabiocmazzo/quillwright"
categories = ["text-editors"]
keywords = ["writing", "fiction", "novel", "markdown", "editor"]
readme = "README.md"
exclude = ["target/", "entries.json", "screenshots/"]

[dependencies]
eframe          = "0.27"
egui            = "0.27"
pulldown-cmark  = { version = "0.10", default-features = false }
rfd             = "0.11"
directories     = "5.0"
serde           = { version = "1.0", features = ["derive"] }
toml            = "0.8"
tempfile        = "3"
fontdb = "0.23"
ab_glyph = "0.2"
notify = "8"
similar = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Export, all pure Rust: typst lays out PDFs, docx-rs writes Word files, and
# EPUB/ODT are zip packages written by hand.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
docx-rs = "0.4.22"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
yaml-rust2 = "0.13"
imagesize = "0.15"
base64 = "0.22"

[[bin]]
name = "quillwright"
path = "src/main.rs"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
# Smaller downloads: drop debug symbols from release binaries.
strip = true
