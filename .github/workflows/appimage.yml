name: AppImage

# Builds the AppImage as the release does, then starts it on a minimal Ubuntu 22.04 (only
# an X server, GTK 3, and Mesa) without network, as the AppImageHub catalog tests it.
on:
  push:
    branches: [main, appimage]
    paths:
      - packaging/linux/**
      - .github/workflows/appimage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
          sudo apt-get install -y patchelf libxkbcommon-x11-0 libxcb-xkb1 libx11-xcb1 libxcursor1 libxrandr2 libxi6
      - run: cargo build --release --locked
      - run: packaging/linux/build.sh 0.0.0-test

      - name: Start it on a minimal system
        run: |
          docker build -t minimal - <<'DOCKERFILE'
          FROM ubuntu:22.04
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                xvfb x11-utils imagemagick libgtk-3-0 libgl1 libegl1 libgl1-mesa-dri
          DOCKERFILE
          docker run --rm --network none -v "$PWD/dist:/dist" minimal bash -c '
            Xvfb :99 -screen 0 1100x760x24 & sleep 2
            export DISPLAY=:99 LANG=C LC_ALL=C APPIMAGE_EXTRACT_AND_RUN=1
            /dist/Quillwright-0.0.0-test-x86_64.AppImage > /dist/app.log 2>&1 & app=$!
            sleep 20
            import -window root /dist/screenshot.png
            if ! kill -0 $app; then echo "Quillwright exited early:"; cat /dist/app.log; exit 1; fi
            xwininfo -root -tree | grep -i quillwright || { echo "No Quillwright window"; cat /dist/app.log; exit 1; }
            cat /dist/app.log
            info=$(/dist/Quillwright-0.0.0-test-x86_64.AppImage --appimage-updateinformation)
            echo "Update information: $info"
            case "$info" in gh-releases-zsync\|fabiocmazzo\|quillwright\|latest\|*) ;; *) exit 1;; esac'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/*.zsync
            dist/screenshot.png
            dist/app.log
          if-no-files-found: ignore
