name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! If you think text may have been lost, say so in the title; that is always treated first.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a project with ...
        2. Click ...
  - type: input
    id: version
    attributes:
      label: Quillwright version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS details
      description: Distribution and desktop on Linux (for example "Fedora 41, GNOME, Wayland"), or the Windows or macOS version.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, the AI tool you use, or relevant parts of your config.
