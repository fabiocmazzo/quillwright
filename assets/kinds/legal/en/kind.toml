# The English variant of the Legal case kind. Values here are merged over ../kind.toml.
language_name = "English"
# A project with any of these is a legal case in English.
detect = ["filings/", "parties/", "facts.md"]
first_file = "filings/001-complaint.md"

[research]
folder = "case-files"

[documents]
folder = "filings"
new_name = "filing-{n}"
new_title = "Filing {n}"

[sheets]
folder = "parties"
new_name = "new-party"
new_title = "New party"
template = "parties/client.md"

[[assistant.context]]
file = "facts.md"
heading = "Facts"
limit = 40000

[[assistant.context]]
file = "timeline.md"
heading = "Timeline"
limit = 16000

[[assistant.context]]
file = "evidence.md"
heading = "Evidence"
limit = 16000

[[assistant.context]]
file = "client-questions.md"
heading = "Client questions"
limit = 12000
