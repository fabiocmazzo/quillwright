# Example Quillwright configuration
# Copy this file to ~/.config/quillwright/config.toml (create directories as needed)

# Optional path to set the initial working directory used by the file tree.
# Remove or comment out this field to fall back to the current directory on launch.
working_dir = "/home/you/notes"

[theme]
# Writing theme: "paper" (warm light), "sepia", or "night" (default).
# The legacy values "light" and "dark" map to "paper" and "night".
# You can also switch themes from View → Theme.
base = "night"

# Optional color overrides (RRGGBB or AARRGGBB, with or without a leading #).
# They apply on top of whichever theme is selected, so leave them commented out
# if you switch between light and dark themes.
# background = "#1F2026"   # the page behind the text
# panel = "#16171B"        # sidebar, menus, and status bar
# text = "#DCD7CE"
# accent = "#D9A066"       # cursor, selection, highlights, and links
# hyperlink = "#D9A066"    # links only; defaults to `accent`

[editor]
# Bundled: Literata (default), Atkinson Hyperlegible; or an installed family name.
# Missing families fall back to Literata. Restart after changing the font family;
# text size can also be changed live with Ctrl+] / Ctrl+[.
font_family = "Literata"
font_size = 18.0
# Line height as a multiplier of font size.
line_height = 1.4
# Optional source Markdown line numbers (wrapped rows are not numbered separately).
line_numbers = false
# Maximum text column width in egui points; the canvas still fills the viewport.
max_width = 760
# Center the text column; false aligns it left with padding.
centered = true
# Keep the line you are writing vertically centered (View → Typewriter Scrolling).
typewriter = false
# Fade every paragraph except the one with the cursor (View → Dim Other Paragraphs).
dim_paragraphs = false
# Save the open file automatically (File → Autosave). Untitled documents are never autosaved.
autosave = true
# Seconds without typing before autosave writes the file.
autosave_delay = 2.0

[view]
# Show the manuscript sidebar (Ctrl+B).
sidebar = true
# Words to write per session; shown as a progress bar in the status bar. 0 hides it.
session_goal = 0

[spelling]
# Underline misspelled words; right-click one for suggestions (View → Check Spelling).
enabled = true
# Each book is checked in the lang of its metadata.yaml (View → Spelling Language sets
# it). This is the Hunspell dictionary for books without one: "en_US", "pt_BR", "es_ES",
# ... Empty: en_US. en_US is built in; others come from the system's Hunspell folders or
# from the "dictionaries" folder in Quillwright's data folder.
# Words you accept for a book are kept in dictionary.txt at the project root.
language = ""

[tools]
# Commands are arrays executed with the temporary markdown file path appended.
# The working directory is set to the configured/active working_dir when present.

# Markdown linter command (Ctrl+Shift+L). Comment out to disable linting.
lint = ["rumdl", "check"]
# When true, run the lint command on the current file instead of a temp buffer.
# Requires the file to be saved before running.
lint_use_open_file = false

# Markdown formatter command (Ctrl+Shift+F). Comment out to disable formatting.
format = ["rumdl", "fmt"]
# When true, run the formatter on the file open in Quillwright (requires saving first).
format_use_open_file = false

[assistant]
# Command used by the assistant panel (Ctrl+K). It runs in the project folder,
# receives the prompt on stdin, and its stdout is shown as the suggestion.
# Comment out to be asked the first time you open the panel.
command = ["claude", "-p"]
# Codex CLI, in a read-only sandbox:
# command = ["codex", "exec", "--skip-git-repo-check", "--sandbox", "read-only", "-"]
# A local model; the manuscript never leaves your machine:
# command = ["ollama", "run", "llama3.1"]

# Append the prompt as the last argument instead of writing it to stdin.
prompt_as_argument = false

[export]
# Manuscript export (File → Export Manuscript..., Ctrl+Shift+E) is built in.
# These are the defaults of the export window, which also saves your choices here.
# Language of the book, for hyphenation and e-readers ("en", "pt-BR", ...).
# Empty: the lang in the project's metadata.yaml, or English.
language = ""
# Page size for PDF, Word, and OpenDocument: "a5", "trade" (6 x 9 in), "a4", "letter".
page_size = "a5"
